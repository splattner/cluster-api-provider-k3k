# HCP cluster: the K3k control plane runs in the management cluster, the worker nodes are
# CAPD (Docker) Machines bootstrapped by the k3s bootstrap provider (KThreesConfig).
# See docs/hcp-mode.md. Requires the docker infrastructure provider and the k3s bootstrap provider.
#
# Variables:
#   HCP_ENDPOINT_HOST   address of a management cluster node, reachable by the Docker Machines
#   HCP_ENDPOINT_PORT   NodePort exposing the K3k server (default 30443)
#   KUBERNETES_VERSION  Kubernetes version, without the K3s suffix (e.g. v1.35.0)
#   KIND_IMAGE_VERSION  kindest/node image of the Docker Machines (default v1.35.0)
#
# The control plane endpoint is set upfront, so CAPD can't override it with its own load balancer.
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: ${NAMESPACE}
spec:
  controlPlaneEndpoint:
    host: ${HCP_ENDPOINT_HOST}
    port: ${HCP_ENDPOINT_PORT:=30443}
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: K3kControlPlane
    name: ${CLUSTER_NAME}
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: DockerCluster
    name: ${CLUSTER_NAME}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DockerCluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: ${NAMESPACE}
spec: {}
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: K3kControlPlane
metadata:
  name: ${CLUSTER_NAME}
  namespace: ${NAMESPACE}
spec:
  mode: hcp
  servers: ${CONTROL_PLANE_MACHINE_COUNT:=1}
  version: ${KUBERNETES_VERSION}-k3s1
  expose:
    nodePort:
      serverPort: ${HCP_ENDPOINT_PORT:=30443}
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: ${CLUSTER_NAME}-md-0
  namespace: ${NAMESPACE}
spec:
  clusterName: ${CLUSTER_NAME}
  replicas: ${WORKER_MACHINE_COUNT:=1}
  selector:
    matchLabels:
      cluster.x-k8s.io/deployment-name: ${CLUSTER_NAME}-md-0
  template:
    metadata:
      labels:
        cluster.x-k8s.io/deployment-name: ${CLUSTER_NAME}-md-0
    spec:
      clusterName: ${CLUSTER_NAME}
      version: ${KUBERNETES_VERSION}+k3s1
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KThreesConfigTemplate
          name: ${CLUSTER_NAME}-md-0
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: DockerMachineTemplate
        name: ${CLUSTER_NAME}-md-0
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DockerMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-md-0
  namespace: ${NAMESPACE}
spec:
  template:
    spec:
      customImage: kindest/node:${KIND_IMAGE_VERSION:=v1.35.0}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KThreesConfigTemplate
metadata:
  name: ${CLUSTER_NAME}-md-0
  namespace: ${NAMESPACE}
spec:
  template:
    spec: {}
